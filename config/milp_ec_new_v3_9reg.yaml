placement_policy: "milp_ec_new_v3"
transfer_policy: "cheapest"
regions:
  - aws:us-east-1
  - aws:us-west-1
  - aws:eu-west-1
  - azure:eastus
  - azure:westus
  - azure:westeurope
  - gcp:us-east1-b
  - gcp:us-west1-a
  - gcp:europe-west1-b
window_size: -1
milp_time_limit_sec: 2.0
milp_mip_gap: 0.05
milp_strict_fail: true
# Optional: first MILP in this JVM writes human-readable LP (use small trace). Example:
# milp_debug_lp_path: "logs/milp_ec_new_v3_first.lp"
