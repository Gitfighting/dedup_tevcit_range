# Delta x EC 2x2 ablation on SkyStore-compatible T79 typeA traces.
# Same trace rows / pricing as tevict baseline; only policy knobs differ.
#
#   corner          | delta | EC branch
#   ----------------|-------|------------------
#   delta_ec        | on    | MILP allows EC (default)
#   delta_rep       | on    | replica-only (allow_ec=false)
#   nodelta_ec      | off   | force_ec_only
#   nodelta_rep     | off   | replica-only (allow_ec=false)
#
# Run: python scripts/run_delta_ec_2x2.py

trace: results/synth/3reg/typeA/IBMObjectStoreTrace079Part0.typeA.p100.delta.mc.aug
trace_id: T79_typeA_p100
tevict_config: config/tevictranges_3reg.yaml
vm: 5
simversion: 3

corners:
  - id: delta_ec
    label: "δ+EC (V4 default)"
    config: config/milp_ec_new_v4_3reg.yaml
  - id: delta_rep
    label: "δ only (replica MILP)"
    config: config/ablation/v4_delta_rep.yaml
  - id: nodelta_ec
    label: "EC only (no δ)"
    config: config/ablation/v4_nodelta_forceec.yaml
  - id: nodelta_rep
    label: "baseline (no δ, replica)"
    config: config/ablation/v4_nodelta_rep.yaml
